# Keep the proofs-and-contributors visualisation up to date (issue #371, ADR-032).
#
# Attribution ("who solved it") is derived from the `prove(<goal>): … by <agent>
# (#PR)` *squash-merge commit*, which only exists on `main` AFTER a proof merges.
# So a PR-time `--check` cannot include the goal a PR is about to prove (it would
# spuriously redden the *next* PR). This runs **post-merge**: on every push to
# `main` that could change the graph it runs `--check`, and on drift regenerates
# the two `docs/` outputs and lands them through an auto-merging PR.
#
# Why a PR and not a direct push (issue #371 follow-up): `main` is a protected
# branch, so the bot pushing straight to it is declined ("protected branch hook
# declined — required status checks are expected"), and concurrent merges also
# produced non-fast-forward rejections. Under the old `git push origin HEAD:main`
# step every refresh run failed and the visualisation never updated. This opens a
# refresh PR and arms squash auto-merge instead, mirroring the upstream-packets
# flow — the gates run on the PR and it merges itself once they are green.
#
# Token note: a branch pushed (and a PR opened) with the default GITHUB_TOKEN
# does not trigger other workflows, so the gates would never run and auto-merge
# would never fire. Set the UPSTREAM_PAT secret (the repo-scoped sponsor PAT,
# already used by upstream-packets) so the refresh branch and PR flow through the
# gates like any other change. Without it the PR is still opened; the gates can
# be kicked by closing/reopening it.
name: proofs-visualisation

on:
  push:
    branches: [main]
    paths:
      - "goals/**"
      - "library/**"
      - "proof-runs/**"
      - "decompositions/**"
      - "tools/visualiser/**"
      - ".github/workflows/proofs-visualisation.yml"
  workflow_dispatch:

# Coalesce bursts of merges into one refresh; never cancel a push mid-commit.
concurrency:
  group: proofs-visualisation-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # full history — attribution reads the prove(…) commits
          # PAT so the refresh branch push and PR trigger the gates (without it
          # auto-merge can never fire); falls back to the default token.
          token: ${{ secrets.UPSTREAM_PAT || github.token }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Check for drift (ADR-032)
        id: check
        run: |
          if python3 -m tools.visualiser --check .; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open an auto-merging refresh PR on drift (ADR-032)
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PAT || github.token }}
        run: |
          set -euo pipefail
          python3 -m tools.visualiser --write .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="auto/proofs-visualisation"
          git switch -C "$branch"
          git add docs/proofs-contributors-visualisation.md docs/proofs-contributors-visualisation.html
          git diff --cached --quiet && { echo "nothing to refresh"; exit 0; }
          git commit -m "docs: refresh proofs-contributors-visualisation"
          # One long-lived refresh branch, force-updated each run, so concurrent
          # merges never cause a non-fast-forward rejection.
          git push --force-with-lease origin "$branch"
          # Open the PR if none is open yet, then (re)arm squash auto-merge.
          if ! gh pr view "$branch" --json number --jq .number >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "docs: refresh proofs-contributors-visualisation" \
              --body "Automated post-merge refresh of the proofs-and-contributors visualisation (issue #371, ADR-032). Regenerated by the proofs-visualisation workflow from the \`prove(…)\` squash-merge commits on \`main\`. Lands via squash auto-merge once the gates are green."
          fi
          gh pr merge --auto --squash "$branch" \
            || echo "auto-merge not armed (set UPSTREAM_PAT so the refresh PR triggers the gates — see header note)"
